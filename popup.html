<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #333;
    }
    
    .container {
      padding: 16px;
    }
    
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #0a66c2;
    }
    
    .setting {
      margin-bottom: 14px;
    }
    
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    input[type="number"],
    select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: monospace;
    }
    
    input[type="number"]:focus,
    select:focus {
      outline: none;
      border-color: #0a66c2;
      box-shadow: 0 0 0 2px rgba(10, 102, 194, 0.1);
    }
    
    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 16px;
    }
    
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    #startBtn {
      background: #0a66c2;
      color: white;
      grid-column: 1 / 3;
    }
    
    #startBtn:hover:not(:disabled) {
      background: #004182;
    }
    
    #startBtn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    #stopBtn {
      background: #f0f0f0;
      color: #333;
      grid-column: 1 / 3;
    }
    
    #stopBtn:hover:not(:disabled) {
      background: #e0e0e0;
    }
    
    #stopBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .status-card {
      margin-top: 16px;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 4px;
      border-left: 3px solid #0a66c2;
    }
    
    .status-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
    }
    
    .status-row:last-child {
      margin-bottom: 0;
    }
    
    .status-label {
      color: #666;
      font-weight: 500;
    }
    
    .status-value {
      color: #0a66c2;
      font-weight: 600;
      font-family: monospace;
    }
    
    .warning {
      margin-top: 12px;
      padding: 10px;
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 4px;
      font-size: 12px;
      color: #856404;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔗 ConnectedIn</h1>
    
    <div class="setting">
      <label for="delay">Delay Between Clicks (ms)</label>
      <input type="number" id="delay" value="500" min="100" max="5000" step="50">
      <div style="font-size: 11px; color: #999; margin-top: 4px;">Recommended: 300-800ms</div>
    </div>
    
    <div class="button-group">
      <button id="startBtn">Start Clicking</button>
      <button id="stopBtn" disabled>Stop</button>
    </div>
    
    <div class="status-card">
      <div class="status-row">
        <span class="status-label">Status:</span>
        <span class="status-value" id="status">Ready</span>
      </div>
      <div class="status-row">
        <span class="status-label">Clicked:</span>
        <span class="status-value" id="clicked">0</span>
      </div>
      <div class="status-row">
        <span class="status-label">Remaining:</span>
        <span class="status-value" id="remaining">0</span>
      </div>
    </div>
    
    <div class="warning">
      ⚠️ LinkedIn rate-limits at ~1,100 connects/week. Don't run continuously.
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
